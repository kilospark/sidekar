<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sidekar — Extension</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/auth-complete.css" />
<style>
/* #loading / #success / #error-view toggles only — layout comes from auth-complete.css */
#ext-token { display: none; }
</style>
</head>
<body class="auth-complete-page">
<div class="auth-complete-card">
  <div id="loading">
    <div class="auth-complete-spinner"></div>
    <h1 class="auth-complete-title">Connecting extension…</h1>
    <p class="auth-complete-subtitle">Generating your extension token.</p>
  </div>
  <div id="success" style="display:none;">
    <div class="auth-complete-icon">&#10003;</div>
    <h1 class="auth-complete-title">Extension authenticated</h1>
    <p class="auth-complete-subtitle">You can close this tab. The Sidekar extension is now connected to your account.</p>
    <div id="ext-token" data-token=""></div>
  </div>
  <div id="error-view" style="display:none;">
    <div class="auth-complete-icon-error">&#10007;</div>
    <h1 class="auth-complete-title">Authentication failed</h1>
    <p class="auth-complete-subtitle" id="error-msg">Something went wrong. Please try again from the extension popup.</p>
  </div>
</div>
<script>
(async function() {
  const loadingEl = document.getElementById("loading");
  const successEl = document.getElementById("success");
  const errorEl = document.getElementById("error-view");
  const errorMsg = document.getElementById("error-msg");
  const tokenEl = document.getElementById("ext-token");

  function showError(msg) {
    loadingEl.style.display = "none";
    errorEl.style.display = "block";
    errorMsg.textContent = msg;
  }

  function showSuccess(token, profile) {
    loadingEl.style.display = "none";
    successEl.style.display = "block";
    tokenEl.setAttribute("data-token", token);
    if (profile) tokenEl.setAttribute("data-profile", JSON.stringify(profile));
    tokenEl.style.display = "block";
    window.postMessage({ type: "sidekar-ext-token", token: token, profile: profile }, "*");
  }

  try {
    const resp = await fetch("/api/auth/device?action=ext-generate", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
    });

    if (resp.status === 401) {
      showError("Not logged in. Please log in to sidekar.dev first, then try again from the extension.");
      return;
    }

    if (!resp.ok) {
      const data = await resp.json().catch(() => ({}));
      showError(data.error || "Failed to generate token. Please try again.");
      return;
    }

    const data = await resp.json();
    if (data.token) {
      showSuccess(data.token, data.profile);
    } else {
      showError("No token received. Please try again.");
    }
  } catch (e) {
    showError("Network error. Please check your connection and try again.");
  }
})();
</script>
</body>
</html>
